<div class="container">
    <h2>Reset Your Password</h2>

    <!-- Display an error if no token is provided -->
    <div *ngIf="!token && message" class="text-danger">
        {{ message }}
    </div>

    <!-- Password Reset Form -->
    <div *ngIf="token">
        <form #resetForm="ngForm" (ngSubmit)="resetPassword()">
            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword" required class="form-control" #passwordInput="ngModel" />
                <div *ngIf="passwordInput.invalid && passwordInput.touched" class="text-danger">
                    New password is required.
                </div>
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="resetForm.invalid">Reset Password</button>
        </form>
        <p *ngIf="message" [ngClass]="{'text-success': !error, 'text-danger': error}">{{ message }}</p>
    </div>
</div>
